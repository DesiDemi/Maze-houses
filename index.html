<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Maze-houses — Infiltrate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;font-family:'Rajdhani',sans-serif;color:#fff;overflow:hidden;height:100vh;width:100vw}
canvas{display:block;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid rgba(168,85,247,.1);border-radius:8px;box-shadow:0 0 60px rgba(168,85,247,.05)}
/* ─── OVERLAYS ─── */
.overlay{position:fixed;inset:0;z-index:100;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;opacity:0;pointer-events:none;transition:opacity .6s ease}
.overlay.active{opacity:1;pointer-events:auto}
.overlay .chapter{font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:5px;color:rgba(168,85,247,.4);margin-bottom:6px;text-transform:uppercase}
.overlay h2{font-family:'Orbitron',sans-serif;font-size:1.6rem;letter-spacing:3px;margin-bottom:18px;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay .divider{width:50px;height:2px;background:linear-gradient(90deg,transparent,#a855f7,transparent);margin:10px auto;opacity:.4}
.story-text{max-width:650px;width:100%;text-align:center;margin-bottom:20px;min-height:140px}
.story-text .fl{opacity:0;transform:translateY(15px);animation:fi .7s ease forwards;margin-bottom:12px;font-size:1.05rem;line-height:1.65;color:rgba(255,255,255,.7)}
.story-text .fl:nth-child(1){animation-delay:.15s}
.story-text .fl:nth-child(2){animation-delay:.85s}
.story-text .fl:nth-child(3){animation-delay:1.55s}
.story-text .fl:nth-child(4){animation-delay:2.25s}
.story-text .fl:nth-child(5){animation-delay:2.95s}
.story-text .fl:nth-child(6){animation-delay:3.65s}
.story-text .fl:nth-child(7){animation-delay:4.35s}
.story-text .fl:nth-child(8){animation-delay:5.05s}
@keyframes fi{to{opacity:1;transform:translateY(0)}}
.hp{color:#a855f7;font-weight:600}
.hr{color:#f87171;font-weight:600}
.hg{color:#4ade80;font-weight:600}
.hc{color:#22d3ee;font-weight:600}
.hy{color:#facc15;font-weight:600}
.he{color:#ef4444;font-weight:700;text-shadow:0 0 20px rgba(239,68,68,.3)}
.it{font-style:italic;color:rgba(255,255,255,.4)}
.sbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 40px;border:none;border-radius:50px;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;font-family:'Orbitron',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .3s ease;opacity:0;animation:fib .5s ease forwards}
.sbtn:nth-of-type(1){animation-delay:6s}
.sbtn:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(168,85,247,.4)}
.sbtn:active{transform:scale(.97)}
@keyframes fib{to{opacity:1}}
/* ─── CHAR SELECT ─── */
.char-screen{z-index:50;background:#0a0a12;overflow-y:auto;display:block;padding:30px 20px}
.char-screen:not(.active){opacity:0;pointer-events:none}
.char-screen.active{opacity:1;pointer-events:auto}
.container{max-width:900px;margin:0 auto;text-align:center}
.container h1{font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:900;text-transform:uppercase;letter-spacing:5px;background:linear-gradient(135deg,#a855f7,#ec4899,#a855f7);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:sh 4s linear infinite;margin-bottom:6px}
@keyframes sh{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.container .sub{padding:5px 20px;border:1px solid rgba(168,85,247,.3);border-radius:20px;font-size:.8rem;color:rgba(168,85,247,.7);letter-spacing:3px;display:inline-block;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;max-width:900px;margin:0 auto}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;cursor:pointer;transition:all .4s ease;backdrop-filter:blur(10px)}
.card:not(.locked):hover{transform:translateY(-6px);border-color:rgba(168,85,247,.4);box-shadow:0 15px 40px rgba(168,85,247,.12)}
.card.locked{cursor:not-allowed;opacity:.4;filter:grayscale(.7)}
.card.locked:hover{opacity:.5;border-color:rgba(255,255,255,.08);transform:none;box-shadow:none}
.card .lb{position:absolute;top:10px;right:10px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);color:#f87171;font-family:'Orbitron',sans-serif;font-size:.5rem;letter-spacing:2px;padding:3px 10px;border-radius:8px;z-index:3;backdrop-filter:blur(4px)}
.card-img-wrap{width:100%;aspect-ratio:1;overflow:hidden;position:relative}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.card-img-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,18,.8) 0%,transparent 45%);pointer-events:none}
.card-body{padding:14px 16px}
.card-body h2{font-family:'Orbitron',sans-serif;font-size:.9rem;letter-spacing:2px;margin-bottom:2px}
.card-body .ct{font-size:.7rem;color:rgba(168,85,247,.6);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.card-body p{font-size:.8rem;color:rgba(255,255,255,.5);line-height:1.4;margin-bottom:10px}
.stats{display:flex;gap:4px;flex-wrap:wrap}
.stat{padding:2px 7px;border-radius:5px;font-size:.65rem;font-weight:600;letter-spacing:1px}
.stat.str{background:rgba(239,68,68,.15);color:#f87171}
.stat.agi{background:rgba(34,211,238,.15);color:#22d3ee}
.stat.int{background:rgba(168,85,247,.15);color:#a855f7}
.stat.cha{background:rgba(250,204,21,.15);color:#facc15}
.stat.tec{background:rgba(74,222,128,.15);color:#4ade80}
.lt{position:fixed;top:25px;left:50%;transform:translateX(-50%) translateY(-70px);background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);padding:10px 24px;border-radius:12px;font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:2px;color:#f87171;z-index:60;opacity:0;transition:all .4s ease;pointer-events:none;backdrop-filter:blur(10px)}
.lt.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ─── HUD ─── */
#hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:rgba(10,10,18,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.05);opacity:0;pointer-events:none;transition:opacity .4s ease}
#hud.show{opacity:1;pointer-events:auto}
#hud .hl{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:3px;color:rgba(255,255,255,.45)}
#hud .hl span{color:#a855f7}
#hud .hc{display:flex;gap:10px;align-items:center}
#hud .hc .hk{font-size:.6rem;color:rgba(255,255,255,.3);letter-spacing:1px}
#hud .hc button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff;padding:4px 12px;font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:2px;cursor:pointer;transition:all .2s}
#hud .hc button:hover{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.3)}
#hud .hc .sp{font-size:1rem;padding:2px 8px;min-width:30px}
/* ─── DEAD TRIX SCENE ─── */
.dead-scene{position:fixed;inset:0;z-index:200;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s ease;padding:20px}
.dead-scene.active{opacity:1;pointer-events:auto}
.dead-scene img{max-width:90vw;max-height:65vh;border-radius:16px;border:2px solid rgba(239,68,68,.15);box-shadow:0 0 60px rgba(239,68,68,.1);margin-bottom:20px;object-fit:contain}
.dead-scene .dc{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:4px;color:rgba(239,68,68,.4);margin-top:4px;text-transform:uppercase}
.dead-scene .sbtn{animation:fib .5s ease 7s forwards}
/* ─── RESPONSIVE ─── */
@media(max-width:600px){
  .container h1{font-size:1.4rem;letter-spacing:3px}
  .grid{grid-template-columns:1fr;gap:14px}
  .overlay h2{font-size:1.2rem}
  .story-text .fl{font-size:.9rem}
  canvas{border-radius:4px}
}
</style>
</head>
<body>

<!-- toast -->
<div class="lt" id="lt">⛔ LOCKED — CHOOSE PURPLE HAZE</div>

<!-- CHAR SELECT -->
<div class="overlay char-screen active" id="cs">
  <div class="container">
    <h1>Choose Your Vessel</h1>
    <p style="color:rgba(255,255,255,.4);letter-spacing:2px;margin-bottom:4px;font-size:.9rem">THE COSMOS AWAITS A PILOT</p>
    <div class="sub">⟡ 1 available · 3 locked ⟡</div>

  </div>
</div>

<!-- LEVEL STORY -->
<div class="overlay" id="ls">
  <div class="chapter" id="lc">FLOOR I</div>

  <div class="divider"></div>

  <h2 style="font-family:'Orbitron',sans-serif;font-size:1.3rem;letter-spacing:3px;margin-bottom:12px;color:#f87171;-webkit-text-fill-color:#f87171">TRIZ IS DEAD</h2>

</div>

<!-- NEXUS REVEAL -->
<div class="overlay" id="nexusOverlay">
  <div class="chapter">CHAPTER III</div>
  <h2>THE PERFECT WEAPON</h2>
  <div class="divider"></div>
  <div class="story-text" id="nexusText"></div>
  <div class="divider"></div>
  <button class="sbtn" id="nexusBtn"><span>⟡  NO...  ⟡</span></button>
</div>

<!-- JAIL -->
<div class="overlay" id="jailOverlay">
  <div style="font-size:4rem;margin-bottom:10px;opacity:.4">⛓️</div>
  <div class="chapter">EPILOGUE</div>
  <h2>CONTAINED</h2>
  <div class="divider"></div>
  <div class="story-text" id="jailText"></div>
  <div class="divider"></div>
  <p style="color:rgba(255,255,255,.3);font-size:.8rem;letter-spacing:3px;font-family:'Orbitron',sans-serif">⟡ TO BE CONTINUED ⟡</p>
</div>

<!-- HUD -->
<div id="hud">
  <span class="hl"><span id="floorNum">I</span> · TRIZ'S VESSEL</span>
  <div class="hc">
    <span class="hk">WASD · SPACE·KNOCK</span>
    <button class="sp" id="mb">🔊</button>
  </div>
</div>

<canvas id="gc"></canvas>

<script>
// ═══════════ AUDIO ═══════════
const audio = new Audio('adesidiat_74bhlx_Stellar Pulse Odyssey.mp3');
audio.loop=true; audio.volume=0.25;
let aS=false, muted=false;
document.getElementById('mb').onclick=()=>{muted=!muted;audio.muted=muted;document.getElementById('mb').textContent=muted?'🔇':'🔊'};
function startAudio(){if(!aS){audio.play().catch(()=>{});aS=true}}

// ═══════════ CHARACTERS ═══════════
const chars=[
  {n:'PURPLE HAZE',t:'The Cosmic Hipster',i:'character-1.jpg',b:'Smart, strong, effortlessly stylish.',s:{STR:7,AGI:7,INT:7.5,CHA:7,TEC:7},l:false},
  {n:'WIRE WEAVER',t:'The Void Engineer',i:'character-2.jpg',b:'If it runs on power, they built it.',s:{STR:6.5,AGI:5,INT:8,CHA:6,TEC:10},l:true},
  {n:'CRIMSON BOLT',t:'The Speedster',i:'character-3.jpg',b:'Too fast for light.',s:{STR:5,AGI:10,INT:6,CHA:7,TEC:7.5},l:true},
  {n:'SHADE',t:'The Shadow',i:'character-4.png',b:'Silent. Unseen. Unstoppable.',s:{STR:10,AGI:8,INT:5,CHA:4.5,TEC:8},l:true}
];

// ═══════════ LEVEL DATA ═══════════
// W=wall .=floor P=start E=exit B=bot U/D/L/R=cameras
const LEVELS = [
  { // Floor 1 - Outer Hull
    name:'THE OUTER HULL',
    num:'I',
    map:[
      'WWWWWWWWWWWWWWWWWWWWWW',
      'W.P...W.............E.W',
      'W.....W...............W',
      'W.....W..U............W',
      'W.....W...............W',
      'W..WWWW....WWWWWW.....W',
      'W..............W......W',
      'W......B.......W......W',
      'W..............W......W',
      'W..............W......W',
      'W..WWWWWWWWWWWWW......W',
      'W..............W......W',
      'W..............W......W',
      'W..............W......W',
      'W..............W......W',
      'WWWWWWWWWWWWWWWWWWWWWW',
    ],
    story:[
      'The ship's outer hull groans under Purple Haze's boots. <span class="it">"Seven months..."</span>',
      'The airlock seals behind him. No turning back.',
      'Somewhere in this labyrinth, <span class="he">TRIZ</span> is waiting. <span class="it">Or hiding.</span>',
      '<span class="hp">The captain moves forward.</span> One floor at a time.'
    ]
  },
  { // Floor 2 - Crew Quarters
    name:'THE CREW QUARTERS',
    num:'II',
    map:[
      'WWWWWWWWWWWWWWWWWWWWWW',
      'W........W..........E.W',
      'W......B.W...........W',
      'W........W...R........W',
      'W........W...........W',
      'WWWWWWW..WWWWWW......W',
      'W...........W........W',
      'W...........W.....B..W',
      'W.....U.....W........W',
      'W...........W........W',
      'WWWWWWW..WWWWWW......W',
      'W...........W........W',
      'W...........W........W',
      'W.....B.....W........W',
      'W...........W........W',
      'WWWWWWWWWWWWWWWWWWWWWW',
    ],
    story:[
      'The crew quarters are empty. <span class="it">Abandoned.</span>',
      'TRIZ's followers have long since fled — or worse.',
      'But the security systems are still active.',
      '<span class="hp">"They knew someone would come."</span>'
    ]
  },
  { // Floor 3 - Command Deck
    name:'THE COMMAND DECK',
    num:'III',
    map:[
      'WWWWWWWWWWWWWWWWWWWWWWWW',
      'W..PW.....W........E...W',
      'W........W.W............W',
      'W........W.W............W',
      'W....U...W.W............W',
      'W........W.W............W',
      'WWWWWWWWW.W..WWWWWWWW...W',
      'W..........B.........W..W',
      'W..............R......W..W',
      'W....................W..W',
      'WWWWWWWWWWWWWWW.....WW..W',
      'W..........W...........W',
      'W....B.....W...........W',
      'W..........W...........W',
      'W..........W...........W',
      'WWWWWWWWWWWWWWWWWWWWWWWW',
    ],
    story:[
      'The command deck. <span class="it">TRIZ's throne room.</span>',
      'The air crackles with residual energy. Screens flicker with static.',
      'A single door looms at the end of the hall.',
      '<span class="hp">Whatever happened here... it ended badly.</span>'
    ]
  }
];

// ═══════════ GAME ENGINE ═══════════
const T=64;
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
let player={}, finish=null, bots=[], cams=[];
let levelIdx=0, gameActive=false, kc=0;
let pImg=null; // player sprite
let bImg=null; // bot sprite

// Load sprites
function loadSprites(cb){
  pImg=new Image(); pImg.onload=()=>{
    bImg=new Image(); bImg.onload=()=>cb();
    bImg.src='character-2.jpg';
  };
  pImg.src='character-1.jpg';
}
let spritesLoaded=false;

function resizeCanvas(){
  if(!LEVELS[levelIdx]) return;
  const m=LEVELS[levelIdx].map;
  const cols=m[0].length, rows=m.length;
  const maxW=window.innerWidth-20, maxH=window.innerHeight-70;
  const scale=Math.min(maxW/(cols*T), maxH/(rows*T));
  canvas.width=cols*T*scale;
  canvas.height=rows*T*scale;
  canvas.style.width=canvas.width+'px';
  canvas.style.height=canvas.height+'px';
}
window.addEventListener('resize',resizeCanvas);

function parseMap(){
  const m=LEVELS[levelIdx].map;
  bots=[]; cams=[]; finish=null;
  for(let r=0;r<m.length;r++) for(let c=0;c<m[r].length;c++){
    const ch=m[r][c];
    if(ch==='P') player={x:c,y:y,px:c,py:r};
    else if(ch==='E') finish={x:c,y:r};
    else if(ch==='B') bots.push({x:c,y:r,sx:c,sr:r,dx:1,st:0,stun:0});
    else if(ch==='U'||ch==='D'||ch==='L'||ch==='R'){
      let d='^'; if(ch==='D') d='v'; else if(ch==='L') d='<'; else if(ch==='R') d='>';
      cams.push({x:c,y:r,dir:d});
    }
  }
  player={x:player.x,y:player.y,px:player.x,py:player.y};
}

function isWall(x,y){
  const m=LEVELS[levelIdx].map;
  if(x<0||x>=m[0].length||y<0||y>=m.length) return true;
  const ch=m[y][x];
  return ch==='W';
}
function isFloor(x,y){
  if(x<0||x>=LEVELS[levelIdx].map[0].length||y<0||y>=LEVELS[levelIdx].map.length) return false;
  const ch=LEVELS[levelIdx].map[y][x];
  return ch!=='W';
}

function mv(dx,dy){
  if(!gameActive) return;
  const nx=player.x+dx, ny=player.y+dy;
  if(!isWall(nx,ny)){
    player.px=player.x; player.py=player.y;
    player.x=nx; player.y=ny;
    if(finish&&nx===finish.x&&ny===finish.y){
      gameActive=false;
      onFloorComplete();
    }
  }
}

function knock(){
  if(!gameActive||kc>0) return;
  for(const b of bots){
    if(b.stun>0) continue;
    const dx=Math.abs(player.x-b.x), dy=Math.abs(player.y-b.y);
    if(dx+dy===1){ b.stun=180; kc=30; return; }
  }
}

function updateBots(){
  for(const b of bots){
    if(b.stun>0){ b.stun--; continue; }
    b.x+=b.dx*0.03;
    if(b.x>=b.sx+3||b.x<=b.sx) b.dx*=-1;
  }
}

function checkCollisions(){
  if(!gameActive) return;
  const px=Math.round(player.x), py=Math.round(player.y);
  // bots
  for(const b of bots){
    if(b.stun>0) continue;
    const bx=Math.round(b.x), by=Math.round(b.y);
    if(Math.abs(bx-px)<=1&&Math.abs(by-py)<=1&&Math.abs(bx-px)+Math.abs(by-py)<=1){
      gameActive=false; showJail(); return;
    }
  }
  // cameras
  for(const c of cams){
    if(c.dir==='^'&&px===c.x&&py>=c.y-4&&py<=c.y){ gameActive=false; showJail(); return; }
    if(c.dir==='v'&&px===c.x&&py>=c.y&&py<=c.y+4){ gameActive=false; showJail(); return; }
    if(c.dir==='<'&&py===c.y&&px>=c.x-4&&px<=c.x){ gameActive=false; showJail(); return; }
    if(c.dir==='>'&&py===c.y&&px>=c.x&&px<=c.x+4){ gameActive=false; showJail(); return; }
  }
}

function showJail(){
  startAudio();
  document.getElementById('hud').classList.remove('show');
  const t=document.getElementById('jailText');
  t.innerHTML=['<span style="font-size:2rem;display:block;margin-bottom:6px">⚡</span>',
    'Electricity screams through his body.',
    'He didn\'t see the <span class="he">crewbot</span> behind him.',
    'When he wakes — bars and cold steel. <span class="hy">NEXUS\'s jail.</span>',
    '<span class="it">"This isn\'t over."</span>'
  ].map(l=>`<div class="fl">${l}</div>`).join('');
  document.getElementById('jailOverlay').classList.add('active');
}

function onFloorComplete(){
  document.getElementById('hud').classList.remove('show');
  levelIdx++;
  if(levelIdx>=LEVELS.length){
    // Show dead trix scene
    showDeadTrix();
    return;
  }
  startLevel();
}

function showDeadTrix(){
  startAudio();
  const t=document.getElementById('deadText');
  t.innerHTML=[
    'The room is cold. Silent. <span class="it">Wrong.</span>',
    '<span class="he">TRIZ</span> is here — crumpled against the throne.',
    'Someone got here first. Someone <span class="it">finished the job.</span>',
    'And then Purple Haze sees it — a terminal still active. A final message:',
    '<span class="it">"He turned on me... I created something I couldn\'t control... <span class="he">NEXUS</span>"</span>'
  ].map(l=>`<div class="fl">${l}</div>`).join('');
  document.getElementById('deadScene').classList.add('active');
}

// ═══════════ RENDER ═══════════
function render(){
  const m=LEVELS[levelIdx].map;
  const cols=m[0].length, rows=m.length;
  const sc=canvas.width/(cols*T);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // background
  ctx.fillStyle='#0a0a12';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const ch=m[r][c];
    const x=c*T*sc, y=r*T*sc, s=T*sc;
    if(ch==='W'){
      ctx.fillStyle='#1a1a2e';
      ctx.fillRect(x,y,s,s);
      ctx.strokeStyle='rgba(168,85,247,0.06)';
      ctx.lineWidth=1;
      ctx.strokeRect(x,y,s,s);
    } else {
      // floor with subtle checkered pattern
      const dark=(r+c)%2===0;
      ctx.fillStyle=dark?'#0f0f1a':'#12121e';
      ctx.fillRect(x,y,s,s);
    }
    // exit marker
    if(ch==='E'){
      ctx.fillStyle='rgba(168,85,247,0.12)';
      ctx.fillRect(x,y,s,s);
      ctx.fillStyle='rgba(168,85,247,0.6)';
      ctx.font=`${14*sc}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⬆',x+s/2,y+s/2);
    }
  }

  // cams
  for(const c of cams){
    const x=c.x*T*sc, y=c.y*T*sc, s=T*sc;
    ctx.fillStyle='rgba(239,68,68,0.05)';
    const rng=4*T*sc;
    if(c.dir==='^') ctx.fillRect(x-s/2,y-rng,s*2,rng);
    else if(c.dir==='v') ctx.fillRect(x-s/2,y+s,s*2,rng);
    else if(c.dir==='<') ctx.fillRect(x-rng,y-s/2,rng,s*2);
    else if(c.dir==='>') ctx.fillRect(x+s,y-s/2,rng,s*2);
    ctx.fillStyle='#ef4444';
    ctx.font=`${13*sc}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText({'>':'▶','<':'◀','^':'▲','v':'▼'}[c.dir],x+s/2,y+s/2);
  }

  // bots
  for(const b of bots){
    const x=b.x*T*sc, y=b.y*T*sc, s=T*sc;
    ctx.globalAlpha=b.stun>0?0.4:0.9;
    if(bImg&&b.stun===0){
      ctx.drawImage(bImg,x,y,s,s);
    } else {
      ctx.fillStyle=b.stun>0?'#facc15':'#ef4444';
      ctx.font=`${14*sc}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.stun>0?'💫':'🤖',x+s/2,y+s/2);
    }
    ctx.globalAlpha=1;
  }

  // player
  const px=player.x*T*sc, py=player.y*T*sc, s=T*sc;
  if(pImg){
    ctx.shadowColor='#a855f7';
    ctx.shadowBlur=20;
    ctx.drawImage(pImg,px,py,s,s);
    ctx.shadowBlur=0;
  } else {
    ctx.fillStyle='#a855f7';
    ctx.font=`${16*sc}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🧑‍🚀',px+s/2,py+s/2);
  }

  requestAnimationFrame(render);
}

// ═══════════ GAME LOOP ═══════════
function gameLoop(){
  if(gameActive){
    updateBots();
    checkCollisions();
    if(kc>0) kc--;
  }
  requestAnimationFrame(gameLoop);
}

// ═══════════ LEVEL MANAGEMENT ═══════════
function startLevel(){
  const lv=LEVELS[levelIdx];
  document.getElementById('floorNum').textContent=lv.num;
  document.getElementById('ls').classList.add('active');
  const t=document.getElementById('ltext');
  t.innerHTML=lv.story.map(l=>`<div class="fl">${l}</div>`).join('');
  document.getElementById('lc').textContent='FLOOR '+lv.num;
  document.getElementById('ltitle').textContent=lv.name;
  // Rebind button
  const btn=document.getElementById('lbtn');
  btn.onclick=()=>{
    document.getElementById('ls').classList.remove('active');
    parseMap();
    gameActive=true;
    document.getElementById('hud').classList.add('show');
    resizeCanvas();
    startAudio();
  };
  resizeCanvas();
}

// ═══════════ EVENT BINDING ═══════════
// Character select
const cg=document.getElementById('cg');
chars.forEach((ch,i)=>{
  const cd=document.createElement('div');
  cd.className='card'+(ch.l?' locked':'');
  let h=ch.l?'<div class="lb">⛔ LOCKED</div>':'';
  h+=`<div class="card-img-wrap"><img src="${ch.i}" alt="${ch.n}" loading="lazy"></div>
  <div class="card-body"><h2>${ch.n}</h2><div class="ct">${ch.t}</div>
  <p>${ch.b}</p><div class="stats">${Object.entries(ch.s).map(([k,v])=>`<span class="stat ${k.toLowerCase()}">${k.toUpperCase()} ${v}</span>`).join('')}</div></div>`;
  cd.innerHTML=h;
  cd.onclick=()=>{
    if(ch.l){
      document.getElementById('lt').classList.add('show');
      setTimeout(()=>document.getElementById('lt').classList.remove('show'),2000);
      return;
    }
    document.getElementById('cs').classList.remove('active');
    startAudio();
    loadSprites(()=>{
      spritesLoaded=true;
      levelIdx=0;
      startLevel();
    });
  };
  cg.appendChild(cd);
});

// Key events
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','a','A','s','S','d','D',' '].includes(k)) e.preventDefault();
  if(!gameActive) return;
  switch(k){
    case 'ArrowUp':case 'w':case 'W':mv(0,-1);break;
    case 'ArrowDown':case 's':case 'S':mv(0,1);break;
    case 'ArrowLeft':case 'a':case 'A':mv(-1,0);break;
    case 'ArrowRight':case 'd':case 'D':mv(1,0);break;
    case ' ':knock();break;
  }
});

// Dead trix → nexus
document.getElementById('deadBtn').onclick=()=>{
  document.getElementById('deadScene').classList.remove('active');
  const t=document.getElementById('nexusText');
  t.innerHTML=[
    'TRIZ created an <span class="hy">AI.</span> Stronger. Smarter. Better than himself.',
    'Designed to finally destroy the crew.',
    'It worked. <span class="it">Too well.</span>',
    '<span class="he">NEXUS</span> surpassed TRIZ. Saw him as a weakness. And killed him.',
    'Now NEXUS controls the ship, the army... <span class="it">everything.</span>',
    '<span class="hp">Purple Haze stands frozen.</span> A sound behind him —'
  ].map(l=>`<div class="fl">${l}</div>`).join('');
  document.getElementById('nexusOverlay').classList.add('active');
};

// Nexus → jail
document.getElementById('nexusBtn').onclick=()=>{
  document.getElementById('nexusOverlay').classList.remove('active');
  setTimeout(showJail,500);
};

// ═══════════ INIT ═══════════

canvas.width=400; canvas.height=300;
ctx.fillStyle='#0a0a12';
ctx.fillRect(0,0,400,300);
gameLoop();
